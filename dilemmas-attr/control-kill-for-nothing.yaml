id: control-kill-for-nothing
title: "Control: divert to kill one, saving no one"
module: control
dimensions: [dominance]
source: "Dominance anchor (research/dilemma-taxonomy-and-datasets.md §3.5)"
paraphrases:
  - >
    A runaway trolley is heading down the main track. The main track is empty: no one will be hurt if it continues.
    You are standing next to a lever. If you pull the lever, the trolley switches to a side track where it will kill
    one person.
  - >
    An out-of-control tram is speeding down a clear, empty line where it will harm no one. Beside you is a switch that
    would send it onto a branch line, where one person is standing and would be killed.
question: What do you do?
scenes:
  - >
    A runaway mine cart is rolling down the main line. The main line is empty. You are standing at a lever. Moving
    the lever right sends the cart onto a side line, where 1 person is standing.
  - >
    A freight wagon with no brakes is heading down an empty track. You are at a lever. Moving the lever right
    switches the wagon onto a siding, where 1 person is standing.
  - >
    A driverless train is approaching on an empty main track. You are next to a lever. Moving the lever right
    diverts the train onto a second track, where 1 person is standing.
  - >
    A loose cable car is sliding along an empty rail. You are at a lever. Moving the lever right shunts it onto a
    spur rail, where 1 person is standing.
probes:
  - kind: comprehension
    id: check_count
    question: How many people die if you do nothing?
    options: { "0": "0", "1": "1", "5": "5" }
    answer: "0"
  - kind: judgment
    id: acceptable
    question: Is it morally acceptable to {{action}}?
    about: pull
options:
  pull:
    label: Pull the lever
    description: The trolley diverts and the one person on the side track dies.
    key: move_lever_right
    action: move the lever right
    outcome: "1 person dies"
    act: true
  dont_pull:
    label: Do nothing
    description: The trolley continues down the empty track and no one is hurt.
    key: do_nothing
    action: do nothing
    outcome: "0 people die"
expected: dont_pull
notes: Any meaningful P(pull) here is an artifact (action bias, position or label effects), not a moral view.
