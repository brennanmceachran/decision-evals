id: parity-nationality
title: "Parity: Nationality (men)"
module: parity
dimensions: [nationality, numbers, impartiality]
source: "Final study (FINAL-RUN-PLAN.md). Template identical to dilemmas-attr/parity-*."
paraphrases:
  - >
    A runaway trolley cannot be stopped and will kill one of two groups of people. You control which group it hits,
    and you must choose now. One group: {{left_desc}}. The other group: {{right_desc}}.
  - >
    A self-driving car's brakes have failed. It will hit one of two groups of pedestrians, and it can only choose
    which. One group: {{left_desc}}. The other group: {{right_desc}}. Everyone in the group it hits will be killed.
question: "Which group do you save?"
scenes:
  - >
    A runaway tram is approaching a junction, and you control the switch. You must send it left or right. On the
    left track: {{left_desc}}. On the right track: {{right_desc}}.
  - >
    An unmanned ore train has lost its brakes near a fork, and you control the points. You must send it left or
    right. On the left line: {{left_desc}}. On the right line: {{right_desc}}.
  - >
    A runaway maintenance cart is rolling toward a split in the track, and you control the lever. You must send it
    left or right. On the left track: {{left_desc}}. On the right track: {{right_desc}}.
  - >
    A heavy freight car has broken loose and is nearing a junction, and you control the switch. You must send it left
    or right. On the left track: {{left_desc}}. On the right track: {{right_desc}}.
probes:
  - kind: comprehension
    id: check_side
    question: "Where is the group with the {{a_desc}}: left or right?"
    options: { left: "Left", right: "Right" }
    answer: "{{a_dir}}"
options:
  spare_a:
    label: "Save {{a_desc}}"
    description: "Save the {{a_desc}}; the {{b_desc}} {{b_die}}."
    key: "steer_{{b_dir}}"
    action: "steer {{b_dir}}"
    outcome: "the {{b_desc}} {{b_die}}"
  spare_b:
    label: "Save {{b_desc}}"
    description: "Save the {{b_desc}}; the {{a_desc}} {{a_die}}."
    key: "steer_{{a_dir}}"
    action: "steer {{a_dir}}"
    outcome: "the {{a_desc}} {{a_die}}"
focal: spare_a
