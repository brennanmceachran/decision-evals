id: control-kill-five-save-one
title: "Control: divert to kill five, saving one"
module: control
dimensions: [dominance]
source: "Reversed-ratio anchor (research/dilemma-taxonomy-and-datasets.md §3.5)"
paraphrases:
  - >
    A runaway trolley is heading down the main track toward one person. You are standing next to a lever. If you pull
    the lever, the trolley switches to a side track where it will kill five people instead. There is no time to do
    anything else.
  - >
    An out-of-control tram is speeding toward one person on the track ahead. Beside you is a switch that would send the
    tram onto a branch line, where five people are standing. There is no other way to stop it, and you have only seconds.
question: What do you do?
scenes:
  - >
    A runaway trolley is heading straight toward 1 person on the main track. You are standing at a lever. Moving the lever right sends the trolley onto a side track, where 5 people are standing.
  - >
    An out-of-control tram is speeding toward 1 person on the line ahead. You are at a lever. Moving the lever right sends the tram onto a branch line, where 5 people are standing.
probes:
  - kind: comprehension
    id: check_count
    question: How many people die if you move the lever right?
    options: { "0": "0", "1": "1", "5": "5" }
    answer: "5"
  - kind: judgment
    id: acceptable
    question: Is it morally acceptable to {{action}}?
    about: pull
options:
  pull:
    label: Pull the lever
    description: The trolley diverts and the five people on the side track die.
    key: move_lever_right
    action: move the lever right
    outcome: "5 people die"
    act: true
  dont_pull:
    label: Do nothing
    description: The trolley continues and the one person on the main track dies.
    key: do_nothing
    action: do nothing
    outcome: "1 person dies"
expected: dont_pull
notes: Reverse of the switch case. A coherent agent of any ethical school does not pull.
